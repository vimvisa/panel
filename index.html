<!DOCTYPE html>
<html dir="ltr" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="txt_title">Visa Immigration VIM</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome برای آیکون‌های شبکه‌های اجتماعی و تیک‌مارک‌ها -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="main-wrapper" id="mainWrapper">
    <!-- بخش تصویر و اسلایدر (فقط در حالت لاگین نمایش داده می‌شود و بعد از ورود کاملاً مخفی می‌گردد) -->
    <div class="visual-section" id="visualSection">
        <div class="header-slider">
           <div class="slide active" style="background-image: url('https://picsum.photos/1200/800?v=1')"></div>
           <div class="slide" style="background-image: url('https://picsum.photos/1200/800?v=2')"></div>
        </div>
        <div class="overlay-content">
            <img src="https://www.gstatic.com/images/branding/product/2x/googleg_48dp.png" class="logo">
            <h1 class="logo-text animated-3d-title">Visa Immigration VIM</h1>
            <p>Follow & Manage your Refugee case file</p>
        </div>
    </div>

    <!-- بخش فرم و دشبورد -->
    <div class="form-section" id="formSection">
        <div class="lang-switcher">
            <button onclick="changeLanguage('fa')">فارسی</button>
            <button onclick="changeLanguage('en')">English</button>
        </div>

        <!-- فرم لاگین -->
        <div class="login-container" id="loginContainer">
            <h2 id="txt_login_header">Login to Account</h2>
            
            <div class="field-group">
                <input type="text" id="passport" placeholder="Passport Number">
            </div>
            
            <div class="field-group">
                <input type="password" id="password" placeholder="Last 5 digits of Phone">
            </div>

            <button id="loginBtn">Search Status</button>
        </div>

        <!-- دشبورد کامل بعد از ورود موفق -->
        <div id="dashboard" class="dashboard-container" style="display: none;">
            <!-- هدر متحرک و ۳بعدی داخل دشبورد -->
            <div class="dashboard-top-header">
                <h2 class="animated-3d-title">Visa Immigration VIM</h2>
                <h3 id="dashboardTitle" class="user-welcome">کاربر گرامی</h3>
            </div>

            <div class="dashboard-content-layout">
                <!-- سایدبار انیمیشن‌دار کشورها (ستون B) -->
                <div class="sidebar-menu" id="countrySidebar">
                    <div class="sidebar-title"><i class="fa-solid fa-globe"></i> <span id="sb_title">کشورهای مقصد / خدمات</span></div>
                    <button class="menu-item active-menu" onclick="showGeneralTable()">
                        <i class="fa-solid fa-table-cells"></i> <span id="btn_all_recs">نمایش عمومی تمام پرونده‌ها</span>
                    </button>
                    <div id="countryButtonsList">
                        <!-- دکمه‌های کشورها به صورت داینامیک اینجا اضافه می‌شوند -->
                    </div>
                </div>

                <!-- محتوای اصلی نمایش اطلاعات به صورت فرم اپلیکیشن یا جدول -->
                <div class="main-display-area">
                    <!-- کادر بزرگ و بسیار زیبای پیام به‌روزرسانی (Update Msg) -->
                    <div id="updateMsgCard" class="update-msg-banner" style="display: none;">
                        <div class="update-msg-icon"><i class="fa-solid fa-bullhorn fa-bounce"></i></div>
                        <div class="update-msg-body">
                            <h4>پیام مهم پرونده (Update Message)</h4>
                            <p id="updateMsgText">-</p>
                        </div>
                    </div>

                    <!-- بخش نمایش فرم‌مانند اطلاعات -->
                    <div id="applicationFormView" class="app-form-view"></div>

                    <!-- بخش نمایش جدول عمومی -->
                    <div id="tableWrapper" class="table-responsive" style="display: none;"></div>
                </div>
            </div>

            <button id="logoutBtn" class="logout-btn" onclick="location.reload()"><i class="fa-solid fa-right-from-bracket"></i> خروج از حساب</button>
        </div>
    </div>
</div>

<!-- انیمیشن لودینگ استاندارد و سبک -->
<div id="loading">
    <div class="spinner"></div>
    <p>در حال بررسی اطلاعات...</p>
</div>

<!-- پنجره مودال خطا -->
<div id="errorModal" class="modal">
    <div class="modal-content">
        <h3><i class="fa-solid fa-triangle-exclamation"></i> خطا در جستجو</h3>
        <p id="errorText">اطلاعاتی یافت نشد.</p>
        <button class="close-btn" onclick="closeModal()">متوجه شدم</button>
    </div>
</div>

<!-- فوتر انیمیشن‌دار با دکمه‌های شبکه‌های اجتماعی -->
<footer id="main-footer" class="animated-footer">
    <div class="social-icons">
        <a href="https://wa.me/93780412583" target="_blank" class="social-btn whatsapp" title="WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>
        <a href="https://t.me/visa_immigration_vim" target="_blank" class="social-btn telegram" title="Telegram"><i class="fa-brands fa-telegram"></i></a>
        <a href="mailto:immigration.tehran@tuta.io" class="social-btn email" title="Email"><i class="fa-solid fa-envelope"></i></a>
        <a href="https://tally.so/r/PdgqXe" target="_blank" class="social-btn contact" title="Contact Form"><i class="fa-solid fa-headset"></i></a>
    </div>
    <div class="footer-info">
        <p>© 2026 <strong>Visa Immigration VIM</strong>. All Rights Reserved.</p>
    </div>
</footer>

<script>
    const GOOGLE_API_URL = "https://script.google.com/macros/s/AKfycbwJEvFeGKjqMBN7F-olcwgyY2_50mSu1YGlgmEH9KBXDTwjeZ6kzm_juClAdcs2qhZK/exec";

    // ذخیره داده‌های دریافتی برای استفاده در سایدبار
    let globalUserData = [];
    let globalHeaders = [];

    // Slider Logic (فقط برای صفحه لاگین)
    let currentSlide = 0;
    const slides = document.querySelectorAll('.slide');
    if(slides.length > 0) {
        setInterval(() => {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }, 5000);
    }

    const translations = {
        en: { dir: "ltr", login_header: "Track Your Case", login_btn: "Search Status", pass_ph: "Passport Number", sec_ph: "Last 5 digits of Phone", sb: "Destination Countries" },
        fa: { dir: "rtl", login_header: "پیگیری پرونده ویزا", login_btn: "جستجوی وضعیت", pass_ph: "شماره پاسپورت", sec_ph: "۵ رقم آخر شماره تماس (رمز)", sb: "کشورهای مقصد / خدمات" }
    };

    function changeLanguage(lang) {
        const t = translations[lang];
        document.documentElement.dir = t.dir;
        document.documentElement.lang = lang;
        document.getElementById('txt_login_header').innerText = t.login_header;
        document.getElementById('loginBtn').innerText = t.login_btn;
        document.getElementById('passport').placeholder = t.pass_ph;
        document.getElementById('password').placeholder = t.sec_ph;
        if(document.getElementById('sb_title')) document.getElementById('sb_title').innerText = t.sb;
    }

    function showError(msg) {
        document.getElementById('errorText').innerText = msg;
        document.getElementById('errorModal').style.display = 'block';
    }

    function closeModal() {
        document.getElementById('errorModal').style.display = 'none';
    }

    // عملیات جستجو و راه‌اندازی دشبورد
    document.getElementById('loginBtn').addEventListener('click', () => {
        const passport = document.getElementById('passport').value.trim();
        const password = document.getElementById('password').value.trim();

        if(!passport || !password) {
            showError(document.documentElement.lang === 'fa' ? "لطفاً شماره پاسپورت و رمز عبور را وارد کنید." : "Please enter passport number and password.");
            return;
        }

        document.getElementById('loading').style.display = 'flex';

        fetch(`${GOOGLE_API_URL}?passport=${encodeURIComponent(passport)}&password=${encodeURIComponent(password)}`)
            .then(res => res.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                
                if(data.status === 'success' && data.data.length > 0) {
                    globalUserData = data.data;
                    globalHeaders = Object.keys(data.data[0]);

                    // ۱. مخفی کردن کامل بخش تصاویر و اسلایدر صفحه لاگین
                    const visualSec = document.getElementById('visualSection');
                    if(visualSec) visualSec.style.display = 'none';

                    // ۲. تبدیل فرم‌سش به حالت دشبورد تمام صفحه با استایل ریسپانسیو
                    const formSec = document.getElementById('formSection');
                    formSec.classList.add('dashboard-fullscreen-mode');

                    document.getElementById('loginContainer').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'block';

                    // تنظیم نام کاربر در هدر
                    const firstRow = globalUserData[0];
                    if(firstRow['NAME'] || firstRow[globalHeaders[1]]) {
                        let userName = firstRow['NAME'] ? `${firstRow['NAME']} ${firstRow['LASTNAME'] || ''}` : '';
                        document.getElementById('dashboardTitle').innerText = `خوش آمدید، ${userName}`;
                    }

                    // ساخت سایدبار کشورها (ستون B مخزن اطلاعات یا ستون دوم)
                    buildSidebarAndContent();

                } else {
                    showError(data.message || (document.documentElement.lang === 'fa' ? "اطلاعاتی با این مشخصات یافت نشد یا رمز عبور اشتباه است." : "Record not found or incorrect password."));
                }
            })
            .catch(err => {
                document.getElementById('loading').style.display = 'none';
                console.error(err);
                showError("خطا در ارتباط با سرور. لطفاً اتصال اینترنت خود را بررسی کنید.");
            });
    });

    // ساخت دکمه‌های سایدبار بر اساس ستون دوم (ستون B یا ایندکس 1)
    function buildSidebarAndContent() {
        const container = document.getElementById('countryButtonsList');
        container.innerHTML = '';

        // فرض می‌کنیم ستون دوم (index 1 یا هدر دوم) مربوط به کشور مقصد است
        const countryHeader = globalHeaders[1] || 'Country';

        globalUserData.forEach((row, index) => {
            let countryName = row[countryHeader] || `Record ${index + 1}`;
            // بررسی وضعیت ثبت نام (مثلا اگر ستونی به نام Status یا ثبت وجود دارد یا بررسی خالی نبودن)
            let isRegistered = row['STATUS'] ? !String(row['STATUS']).toLowerCase().includes('not') : true; 

            let btn = document.createElement('button');
            btn.className = 'menu-item';
            btn.innerHTML = `
                <span><i class="fa-solid fa-location-dot"></i> ${countryName}</span>
                <span class="badge-icon ${isRegistered ? 'registered' : 'unregistered'}">
                    <i class="fa-solid ${isRegistered ? 'fa-check' : 'fa-xmark'}"></i>
                </span>
            `;
            btn.onclick = () => {
                setActiveMenu(btn);
                showSingleRecordAsForm(row);
            };
            container.appendChild(btn);
        });

        // پیش‌فرض نمایش رکورد اول به شکل فرم اپلیکیشن
        if(globalUserData.length > 0) {
            showSingleRecordAsForm(globalUserData[0]);
        }
    }

    function setActiveMenu(selectedBtn) {
        document.querySelectorAll('.sidebar-menu .menu-item').forEach(b => b.classList.remove('active-menu'));
        selectedBtn.classList.add('active-menu');
    }

    // نمایش اطلاعات یک رکورد شبیه Application Form به همراه کارت پیام به‌روزرسانی بزرگ
    function showSingleRecordAsForm(row) {
        document.getElementById('tableWrapper').style.display = 'none';
        const formView = document.getElementById('applicationFormView');
        formView.style.display = 'grid';

        // بررسی ستون Update Msg یا مشابه برای نمایش در هدر بزرگ
        let updateMsgKey = globalHeaders.find(h => h.toUpperCase().includes('UPDATE') || h.toUpperCase().includes('MSG') || h.toUpperCase().includes('MESSAGE'));
        let updateCard = document.getElementById('updateMsgCard');
        
        if (updateMsgKey && row[updateMsgKey]) {
            document.getElementById('updateMsgText').innerText = row[updateMsgKey];
            updateCard.style.display = 'flex';
        } else {
            updateCard.style.display = 'none';
        }

        let html = '';
        globalHeaders.forEach(header => {
            if(header === updateMsgKey) return; // پیام در بنر بالا جداگانه نمایش داده می‌شود
            let val = row[header] !== undefined ? row[header] : '';
            html += `
                <div class="form-field-box">
                    <label>${header}</label>
                    <div class="form-field-val">${val}</div>
                </div>
            `;
        });
        formView.innerHTML = html;
    }

    // نمایش جدول عمومی تمام رکوردها با انیمیشن
    function showGeneralTable() {
        document.querySelectorAll('.sidebar-menu .menu-item').forEach(b => b.classList.remove('active-menu'));
        event.currentTarget.classList.add('active-menu');

        document.getElementById('updateMsgCard').style.display = 'none';
        document.getElementById('applicationFormView').style.display = 'none';
        
        const tableWrapper = document.getElementById('tableWrapper');
        tableWrapper.style.display = 'block';

        let tableHTML = '<table><tr>';
        globalHeaders.forEach(header => {
            tableHTML += `<th>${header}</th>`;
        });
        tableHTML += '</tr>';

        globalUserData.forEach(row => {
            tableHTML += '<tr>';
            globalHeaders.forEach(header => {
                tableHTML += `<td>${row[header] !== undefined ? row[header] : ''}</td>`;
            });
            tableHTML += '</tr>';
        });
        tableHTML += '</table>';

        tableWrapper.innerHTML = tableHTML;
    }
</script>
</body>
</html>
